! BGPd configuration file

! this is a comment

hostname bgpd-R2
password en
enable password en

router bgp 2
  no bgp ebgp-requires-policy
  no bgp network import-check

  bgp router-id 9.0.2.1
  network 12.0.0.0/8

  neighbor 9.0.12.12 remote-as 1
  neighbor 9.0.12.12 timers 5 5

  neighbor 9.0.23.32 remote-as 3
  neighbor 9.0.23.32 timers 5 5

  neighbor 9.0.24.42 remote-as 4
  neighbor 9.0.24.42 timers 5 5

  neighbor 9.0.25.52 remote-as 5
  neighbor 9.0.25.52 timers 5 5

log file /tmp/R2-bgpd.log

debug bgp as4
debug bgp keepalives
debug bgp updates
!debug bgp events
!debug bgp filters
!debug bgp fsm

log stdout
