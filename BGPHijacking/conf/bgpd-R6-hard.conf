! BGPd configuration file

! this is a comment

hostname bgpd-R5
password en
enable password en

router bgp 6
  no bgp ebgp-requires-policy
  no bgp network import-check

  ! rogue router - falsely advertising network of AS1
  bgp router-id 9.0.6.1
  network 11.0.0.0/8
  network 11.0.1.0/24


  neighbor 9.0.56.56 remote-as 5
  neighbor 9.0.56.56 timers 5 5

log file /tmp/R3-bgpd.log

debug bgp as4
debug bgp keepalives
debug bgp updates
!debug bgp events
!debug bgp filters
!debug bgp fsm

log stdout
